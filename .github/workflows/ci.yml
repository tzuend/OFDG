name: numerical-regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI and MFEM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libhypre-dev \
            libmetis-dev python3-numpy python3-matplotlib
      - name: Build MPI MFEM
        run: |
          git clone --depth 1 https://github.com/mfem/mfem.git ../mfem
          make -C ../mfem config MFEM_USE_MPI=YES MFEM_USE_METIS_5=YES
          make -C ../mfem -j2
      - name: Unit, MPI, and independent-reference tests
        run: |
          make -j2 test-release reference-solver
          make test-parallel test-study
      - name: Reduced end-to-end study
        run: |
          make -j2 release
          python3 scripts/run_study.py --profile quick --only advection_1d \
            --skip-build --output /tmp/oedg-ci-study
          python3 scripts/analyze_study.py --profile quick \
            --input /tmp/oedg-ci-study/results.csv
